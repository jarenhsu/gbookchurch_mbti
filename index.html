    <!-- ENFJ謎團 -->
    <section id="mystery">
        <h2 class="section-title">ENFJ 謎團</h2>
        <div class="divider"></div>
        <p class="section-subtitle">為什麼最「像領袖」的類型，在牧者中幾乎消失？</p>

        <div class="insight-box">
            <div class="insight-title">謎團的證據</div>
            <div class="insight-text">
                平信徒 ENFJ：2,594 人（9.0%）<br>
                牧者 ENFJ：15 人（0.91%）<br>
                <strong>比例：只有平信徒的 1/10</strong><br><br>
                整個 NFJ 人群：平信徒 17.6% → 牧者 3.7%<br>
                這是所有類型中最誇張的落差。
            </div>
        </div>

        <div class="insight-box">
            <div class="insight-title">為什麼不能簡單說「ENFJ 不適合當牧師」</div>
            <div class="insight-text">
                ❌ ENFJ 看起來「最牧師」——天生領袖、教導者、鼓舞者、群體動員家<br>
                ❌ <strong>很多成功的牧師確實是 ENFJ</strong><br>
                ❌ 一個研究無法證明因果——是 ENFJ 少進牧職？還是進去後改變了？<br><br>
                所以這不是結論，而是謎團。
            </div>
        </div>

        <div class="insight-highlight">
            <strong>這個謎團邀請我們重新思考「誰適合牧職」這個問題。</strong>
        </div>
    </section>
